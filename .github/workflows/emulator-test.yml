name: Emulator Test

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: "ID judul untuk diputar (skema anilist-<id>)"
        required: true
        default: "anilist-113415"
      ep:
        description: "Nomor episode"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pasang & putar di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.anibix.app/.MainActivity --es test_id "${{ inputs.title_id }}" --ei test_ep "${{ inputs.ep }}"
            sleep 25
            adb exec-out screencap -p > shot1.png
            sleep 45
            adb exec-out screencap -p > shot2.png
            sleep 60
            adb exec-out screencap -p > shot3.png
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml ui.xml
            sleep 90
            adb exec-out screencap -p > shot4.png
            adb shell uiautomator dump /sdcard/ui2.xml && adb pull /sdcard/ui2.xml ui2.xml
            adb logcat -d > logcat.txt
            adb shell dumpsys activity processes > processes.txt

      - name: Unggah bukti uji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            shot*.png
            ui*.xml
            logcat.txt
            processes.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Unggah APK yang diuji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-tested
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
