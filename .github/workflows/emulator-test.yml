name: Emulator Test

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: "ID judul untuk diputar (skema anilist-<id>)"
        required: true
        default: "anilist-113415"
      ep:
        description: "Nomor episode"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Probe magnet yang sama dari jaringan runner (aria2, di luar emulator)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2 > /dev/null 2>&1 || true
          MAGNET=$(curl -s "https://cdn.jsdelivr.net/gh/adiytharpansa/screaperv1@main/output/catalog.json" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for e in data:
              if e['anilistId'] == 113415:
                  for ep in e['torrents']['episodes']:
                      if ep['episode'] == 1:
                          print(ep['magnet']); break
          ")
          echo "magnet diperoleh: ${MAGNET:0:60}..."
          mkdir -p /tmp/probe
          timeout 150 aria2c --bt-metadata-only=true --bt-save-metadata=true --seed-time=0 \
            --bt-timeout=100 --connect-timeout=15 -d /tmp/probe "$MAGNET" || true
          if ls /tmp/probe/*.torrent > /dev/null 2>&1; then
            echo "PROBE_METADATA_OK" | tee probe.txt
          else
            echo "PROBE_METADATA_GAGAL" | tee probe.txt
          fi
          ls -la /tmp/probe || true

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pasang & putar di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.anibix.app/.MainActivity --es test_id "${{ inputs.title_id }}" --ei test_ep "${{ inputs.ep }}"
            sleep 30
            adb exec-out screencap -p > shot1.png
            adb shell input tap 1200 160
            sleep 3
            adb exec-out screencap -p > shot2.png
            sleep 80
            adb shell input tap 1200 160
            sleep 3
            adb exec-out screencap -p > shot3.png
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml ui.xml
            sleep 90
            adb shell input tap 1200 160
            sleep 3
            adb exec-out screencap -p > shot4.png
            sleep 60
            adb exec-out screencap -p > shot5.png
            adb shell uiautomator dump /sdcard/ui2.xml && adb pull /sdcard/ui2.xml ui2.xml
            adb logcat -d > logcat.txt
            adb shell dumpsys media.player > mediaplayer.txt || true
            adb shell dumpsys activity processes > processes.txt

      - name: Unggah bukti uji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            shot*.png
            ui*.xml
            logcat.txt
            mediaplayer.txt
            processes.txt
            probe.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Unggah APK yang diuji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-tested
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
